# Task contract template for the 05-api landing.
# Unbound to a key on purpose: `orun task create --contract` seals and
# attaches it to the key the allocator issues. gates: [] is a DECLARATION —
# merge alone finishes this task; the main convergence is the gate the phase
# WATCHES, not one the plane observes as a PR check.
#
# This contract absorbed the retired 06-site landing's. The ordering survives
# the fold — web-site `dependsOn: site-api`, so one convergence deploys the
# API before the site that health-checks it — and what goes away is the second
# landing's fixed cost, not the edge.
apiVersion: orun.io/v1
kind: TaskContract
spec:
  goal: The site API — the one publicly routable Worker, carrying every write path a visitor reaches — is live on stage and prod, and the website in front of it is live with every content route prerendered
  affects:
    - site-api
    - site-api-tests
    - web-site
    - web-site-tests
  doneWhen:
    - site-api /health 200 on stage and prod
    - the site answers on stage and prod
  gates: []
