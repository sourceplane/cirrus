apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: launches-worker
  description: Cloudflare Worker for the Launches bounded context (the launch directory — products, upvotes, comments, maker profiles)
spec:
  type: cloudflare-worker-turbo
  lifecycle: production
  owner: platform
  domain: product-runtime
  path: apps/launches-worker
  dependsOn:
    - component: cloudflare-d1
  # BF6 wiring documents from orun secrets: lease-published by the infra
  # components; wire-live renders the wrangler template from these.
  secretEnv:
    WIRING_CLOUDFLARE_D1_STAGE: "secret://lumen/cirrus/stage/WIRING_CLOUDFLARE_D1"
    WIRING_CLOUDFLARE_D1_PROD: "secret://lumen/cirrus/prod/WIRING_CLOUDFLARE_D1"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    workspaceDir: ../..
    appDir: .
    orgName: sourceplane
    owner: sourceplane
    repo: cirrus
    turboFilter: "@saas/launches-worker"
    wranglerConfig: wrangler.jsonc
    wranglerTemplate: wrangler.template.jsonc
    wiringComponents: "cloudflare-d1"
    wiringEnvs: "stage,prod"
    wiringFixture: wiring.fixture.json
    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@saas/launches-worker
    typecheckCommand: pnpm exec turbo run typecheck --filter=@saas/launches-worker
    dryRunCommand: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --env prod
    deployCommand: pnpm exec wrangler deploy --config wrangler.jsonc --env prod
    preDeployCommand: "echo 'No pre-deploy step configured.'"
    migrationCommand: "echo 'Migrations run through the db-migrate component.'"
    smokeCommand: "echo 'No smoke test configured.'"
  labels:
    team: platform
    layer: runtime
    surface: launches
    runtime: cloudflare
