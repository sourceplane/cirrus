name: Checks

# Credential-free verification: install, render the offline wrangler fixtures,
# typecheck, and run every test suite. Runs on every push and PR alongside the
# Orun CI (ci.yml), which needs the product's workspace to be linked.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Render offline wrangler fixtures
        run: pnpm -r --if-present run wire:fixture
      # Build, typecheck, then test as separate invocations. The test lane runs
      # at concurrency 2: every suite is ts-jest (a full TypeScript program per
      # worker), and a wider fan-out oversubscribes the runner badly enough that
      # module resolution intermittently fails.
      - run: pnpm exec turbo run build --concurrency=4
      - run: pnpm exec turbo run typecheck --concurrency=4
      - run: pnpm exec turbo run test --concurrency=2
