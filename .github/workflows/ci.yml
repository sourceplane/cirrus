name: CI

on:
  push:
    branches: [main]
  pull_request:

# PR runs share a group per ref and superseded runs are cancelled (each
# push re-plans anyway), which stops stale fan-outs from starving the
# runner pool. Main pushes get a unique group each: convergence runs plan
# --changed per commit, and GitHub replaces *pending* runs in a shared
# group even with cancel-in-progress false — a superseded main run's
# components would silently never converge.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # The bootstrap flows' contract suite, run directly rather than through a
  # component. Two reasons it does not ride `tests/flows`:
  #
  #   1. Its `quick-check` profile runs setup, install and a package-structure
  #      check — and no tests. Verified on this very PR: the lane went green
  #      having executed `4 passed, 0 failed` steps, none of which was a test.
  #      Every turbo-package component in the repo uses that profile, so this
  #      is not a mis-set component; changing it is a guess at a composition
  #      published as an OCI artifact and not readable from this repo.
  #   2. These scripts need bash, python3 and git and nothing else — no
  #      workspace install, no network, no credential. A 20-second job that
  #      certainly fails a pull request beats a two-minute one that certainly
  #      does not.
  #
  # Until the composition grows a profile that runs a package's tests, THIS is
  # the job that makes the suite able to fail a PR.
  flows-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Contract tests (track, land-pr, agent-build, phase-vars, manifest, converge, phases, coverage)
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          for t in track land-pr agent-build phase-vars manifest converge phases coverage; do
            echo "── $t"
            bash "flows/testing/$t.test.sh"
          done

  # THE BLUEPRINT PARSES WITH THE BINARY A BOOTSTRAP ACTUALLY RUNS.
  #
  # This job exists because its absence let a real regression reach main. BE1
  # rewrote `repo-blueprint.yaml` to orun's phase overlay and repointed every
  # flow at `orun new --blueprint repo-blueprint.yaml --phase <name>`. It was
  # verified against an orun built from that repo's main — and no released orun
  # could read a word of it:
  #
  #     ✕ unknown flag: --phase
  #     ✕ parse blueprint: yaml: unmarshal errors:
  #         line 613: cannot unmarshal !!map into []scaffold.Hook
  #
  # Every test in this repo passed. They all read the YAML with PyYAML, which
  # will parse anything well-formed; not one of them asked the question that
  # matters, which is whether the CLI at the PINNED VERSION can read it.
  #
  # So this job pins the same version the bootstrap does and makes orun itself
  # answer. `--status` derives every phase's state: it parses the document,
  # validates each phase's hooks against the action registry, compiles every
  # `when` and every narration template, and writes nothing. It does not probe
  # — derivation asks the tree, not the network — so it needs no credential.
  blueprint-parses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: sourceplane/orun-action@v1.2.0
        with:
          version: v2.56.2
      - name: repo-blueprint.yaml, read by the pinned CLI
        run: |
          set -euo pipefail
          orun --version
          # Inputs that are `required: true` must be supplied for the document
          # to resolve; the values are arbitrary and nothing is written.
          orun new --blueprint repo-blueprint.yaml --status \
            --out "$(mktemp -d)" \
            --set repoName=acme-cloud \
            --set "productName=Acme Cloud" \
            --set productDomain=acme.dev \
            --set githubOrg=acme-inc
      # Tier 1's leak gate. It derives what every phase WOULD place and gates
      # that set — so it needs orun, which is why it rides this job rather than
      # the bash-only one above.
      - name: the leak gate — what a product carries
        run: bash flows/testing/leak.test.sh
      # Tier 1's other half (BE5b). This one PLACES the tree, brands it exactly
      # as 01-scaffold's hooks do, and runs the phases that follow — which is
      # the step nothing here had ever taken, and where orun BE-O12's two
      # defects lived. It needs node for rebrand alongside orun, and about ten
      # seconds. Still offline: placement writes files, and since BE-O12 a run
      # with hooks off does not probe.
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Tier 1 — the tree is placed, branded, and made to answer
        run: bash flows/testing/placement.test.sh

  plan:
    runs-on: ubuntu-latest
    outputs:
      job-matrix: ${{ steps.matrix.outputs.job-matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: sourceplane/orun-action@v1.2.0
        with:
          version: v2.56.2
      - env:
          # Surface the best-effort catalog auto-sync (execution.state.autopushCatalog).
          # A successful push prints "✓ pushed catalog …"; ORUN_VERBOSE also makes
          # any skip/failure visible instead of silent.
          ORUN_VERBOSE: "1"
        run: |
          set -euo pipefail

          plan_args=(
            --from-ci github
            --event-file "$GITHUB_EVENT_PATH"
            --intent intent.yaml
            --output plan.json
            --changed
          )

          orun plan "${plan_args[@]}"
      - id: matrix
        run: |
         echo "job-matrix=$(jq -c '[.jobs[] | {"job-id": .id, "job-name": .checkName}]' plan.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: orun-plan
          path: plan.json

  run:
    needs: plan
    runs-on: ubuntu-latest
    if: ${{ needs.plan.outputs.job-matrix != '[]' && needs.plan.outputs.job-matrix != '' }}
    strategy:
      fail-fast: false
      # Stagger the fan-out: every lane hits the lease-bound resolve at job
      # start, and an unbounded herd saturated it twice. The orun DAG already
      # serializes dependents, so capped parallelism costs little wall-clock.
      max-parallel: 8
      matrix:
        include: ${{ fromJson(needs.plan.outputs.job-matrix) }}
    name: ${{ matrix.job-name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: orun-plan
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sourceplane/orun-action@v1.2.0
        with:
          version: v2.56.2
      # exec-id is the RUN id alone (no attempt suffix): a `gh run rerun
      # --failed` then RESUMES the same orun execution — jobs that succeeded in
      # a prior attempt stay completed, so re-run lanes' cross-job dependencies
      # are already satisfied instead of waiting forever on lanes that are not
      # re-running (the partial-rerun deadlock). --retry re-opens THIS lane's
      # job when it terminally failed in a prior attempt (no-op on first
      # attempts) — together they make `gh run rerun --failed` a true resume.
      - run: |
          # --retry only on re-run attempts: on a fresh attempt a failed
          # upstream is a genuine failure and dependents must fail fast; on a
          # resume (gh run rerun --failed) the upstream's own retry lane will
          # re-open it, so lanes wait out the race instead.
          retry_flag=""
          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then retry_flag="--retry"; fi
          # Remote state authenticates to the platform over OIDC, and the
          # backend refuses a pull_request OIDC token BY DESIGN — a PR must
          # never obtain deploy/state credentials. The refusal resource-hides
          # as `not_found`, so every PR lane died at
          #   ✕ remote state auth (oidc exchange): OIDC exchange rejected:
          #     Not found (code: not_found)
          # BEFORE running a single test body. That is why tests/flows has
          # never been able to fail a pull request: it never ran on one.
          #
          # So a PR runs with NO state flag. Per specs/core/repo.md the
          # portable base command is `orun run --plan … --job …` and remote
          # state is an additive opt-in, so omitting it keeps state local and
          # the verify profile — build, typecheck, tests — is entirely offline.
          # Push-to-main keeps it for coordination and the live run view.
          # (Same shape as orun-cloud's ci.yml, which fixed this first.)
          state_flag=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then state_flag="--remote-state"; fi
          orun run \
            --plan plan.json \
            --runner github-actions \
            $state_flag \
            --job "${{ matrix.job-id }}" \
            --exec-id "${{ github.run_id }}" \
            $retry_flag
        env:
          # GITHUB_TOKEN is the only credential CI holds — GitHub-issued and
          # ephemeral. Every provider credential (the Cloudflare token and
          # account id — this baseline has no second provider) is an
          # orun-managed secret:
          # brokered fresh per run from the workspace's integrations, resolved
          # lease-bound by the jobs that declare it (profile secretBindings or
          # component secretEnv), and log-redacted. Nothing provider-shaped is
          # stored in GitHub.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: /home/runner/.docker
